name: Release ByteDocs Theme

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package theme assets
        run: |
          mkdir -p dist
          cp assets/bytedocs.css dist/
          cp assets/bytedocs-dark.css dist/
          zip -j dist/bytedocs-theme.zip dist/bytedocs.css dist/bytedocs-dark.css

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bytedocs-theme.zip
            dist/bytedocs.css
            dist/bytedocs-dark.css
          generate_release_notes: true